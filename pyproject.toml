[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-engine-spec"
version = "0.10.0"
description = "MotionSpec validation, ingestion, planning, and deterministic previews"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["jsonschema>=4.21,<5", "openpyxl>=3.1,<4", "pypdf>=4,<7", "python-docx>=1.1,<2", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "reportlab>=4,<5", "imageio-ffmpeg>=0.5,<1"]

[project.scripts]
motion-engine = "motion_engine.cli:main"

[tool.setuptools.package-data]
motion_engine = ["MotionSpec.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
